# ArgoCD Application: portal (production), the Portal web app (static SPA served by nginx) at the root domain.
# It only talks to the gateway https://api.example.com from the browser (cookie + CORS): API_BASE below is its runtime config
# (config.js), and https://momofamily.top must be listed in GATEKEEPER_UI_ORIGINS of gatekeeper.yaml and be a post logout URI
# of the identity client `gatekeeper` (add https://momofamily.top/ to post_logout_uris of the setup config in identity.yaml).
# Chart and image are published by the web CI/CD; targetRevision is updated by its deployment PRs.
# The release name must stay `portal`: the chart mounts the ConfigMap `portal-runtime-config`.
# SAMPLE revision, hosts and secret names: replace them before merging.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/huponx/charts
    chart: portal
    targetRevision: "v2026.11.10-release-fb10fc5"
    helm:
      releaseName: portal
      valuesObject:
        application:
          config:
            runtime:
              data:
                API_BASE: "https://api.momofamily.top"
                # the cards of the home page (JSON: name, url, icon, perm, widget); Admin is not listed on purpose, whoever needs it types its URL
                APPS: |-
                  [{"name":"Dict","url":"https://dict.momofamily.top","icon":"book-open","perm":"dictionary:word:read","widget":"dict-review"},{"name":"Bill","url":"https://bill.momofamily.top","icon":"receipt","perm":"bill:invoice:read"}]
          ingress:
            enabled: true
            host: "momofamily.top"
            tls: true
            tlsSecretName: "portal-tls"
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 4
          pdb:
            enabled: true
            minAvailable: 50%
  destination:
    name: in-cluster
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
