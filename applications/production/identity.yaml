# ArgoCD Application: identity (production), OAuth 2.0 / OpenID Connect provider (JWT, RBAC, token exchange, MFA).
# Chart and image are published to ghcr.io by the identity CI/CD; targetRevision is updated by its deployment PRs.
# SAMPLE revision, hosts and secret names: replace them before merging.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/huponx/charts
    chart: identity
    targetRevision: "v2026.11.10-release-c1fde1f"
    helm:
      releaseName: identity
      valuesObject:
        application:
          config:
            data:
              ENV: "production"
              SERVICE_NAME: "identity"
              IDENTITY_ISSUER: "https://auth.momofamily.top"
              IDENTITY_SIGNING_KEY_ID: "k1"
              # applications listed on /apps (Name=https://url|https://icon, the icon is optional, comma separated); replace the examples
              IDENTITY_APPS: |-
                Admin Portal=https://admin.momofamily.top|https://admin.momofamily.top/logo.svg
                Dict=https://dict.momofamily.top|https://dict.momofamily.top/logo.svg
                Bill=https://bill.momofamily.top
              IDENTITY_MFA_MODE: "optional"
              IDENTITY_MFA_ISSUER_NAME: "MoMoFamily"
              # CIDR of the ingress controller (client IP of the rate limits)
              IDENTITY_TRUSTED_PROXIES: "10.0.0.0/8"
              POSTGRES_HOST: "postgres-external.infrastructure.svc.cluster.local"
              POSTGRES_DB: "data"
              POSTGRES_USER: "data-user-rw"
              REDIS_HOST: "redis-external.infrastructure.svc.cluster.local"
              REDIS_PORT: "6379"
              COURIER_TARGET: "courier.application.svc.cluster.local:9090"
          # Existing Secrets, never in git: created by mm-ansible (`k8s_secrets`, values in its vault). The signing key
          # Secret `identity-signing-key` (key signing.pem) is mounted by the chart.
          secrets:
            - name: POSTGRES_PASSWORD
              secretName: postgres-data-rw-credentials
              key: password
            - name: REDIS_PASSWORD
              secretName: redis-local-credentials
              key: password
            - name: IDENTITY_MFA_KEY
              secretName: identity-mfa-key
              key: keys
          ingress:
            enabled: true
            host: "auth.momofamily.top"
            tls: true
            tlsSecretName: "identity-tls"
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 4
          pdb:
            enabled: true
            minAvailable: 1
        # Initial setup Job (first admin, gatekeeper client, exchange policy): see the identity README
        # ("Initial setup Job"). It creates the admin only when no admin exists, with the temporary password of
        # the Secret identity-admin (the admin must change it at the first sign in). REMOVE this whole `setup:`
        # block after the Job succeeded and the admin changed the password; it is not needed again.
        setup:
          enabled: true
          job:
            container:
              env:
                - name: POSTGRES_HOST
                  value: "postgres-external.infrastructure.svc.cluster.local"
                - name: POSTGRES_DB
                  value: "data"
                - name: POSTGRES_USER
                  value: "data-user-rw"
                - name: SETUP_CONFIG
                  value: '{"admin":{"email":"hung.phamqk@gmail.com"},"clients":[{"id":"gatekeeper","type":"confidential","resource":"gatekeeper","secret_env":"GATEKEEPER_CLIENT_SECRET","backchannel_logout_uri":"http://gatekeeper.application.svc/auth/backchannel-logout","redirect_uris":["https://api.momofamily.top/auth/callback"],"post_logout_uris":["https://admin.momofamily.top/","https://dict.momofamily.top/","https://bill.momofamily.top/","https://momofamily.top/"],"grants":["authorization_code","refresh_token","client_credentials","urn:ietf:params:oauth:grant-type:token-exchange"]},{"id":"dictionary","type":"confidential","resource":"dictionary","secret_env":"DICTIONARY_CLIENT_SECRET","grants":["client_credentials","urn:ietf:params:oauth:grant-type:token-exchange"]}],"exchange_policies":[{"client":"gatekeeper","audience":"identity","max_depth":1},{"client":"gatekeeper","audience":"dictionary","max_depth":1},{"client":"dictionary","audience":"identity","max_depth":2}]}'
          secrets:
            - name: POSTGRES_PASSWORD
              secretName: postgres-data-rw-credentials
              key: password
            - name: SETUP_ADMIN_PASSWORD
              secretName: identity-admin
              key: password
            - name: GATEKEEPER_CLIENT_SECRET
              secretName: gatekeeper-client
              key: secret
            - name: DICTIONARY_CLIENT_SECRET
              secretName: dictionary-client
              key: secret
  destination:
    name: in-cluster
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
