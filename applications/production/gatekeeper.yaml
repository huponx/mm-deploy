# ArgoCD Application: gatekeeper (production), the shared HTTP gateway https://api.example.com.
# The web apps (dict.example.com, bill.example.com, ...) call it from the browser (cookie + CORS); mobile apps
# and services call it with Authorization: Bearer. A new web app only needs its origin added to
# GATEKEEPER_UI_ORIGINS (and a post logout URI on the identity client). Chart and image are published by the
# gatekeeper CI/CD; targetRevision is updated by its deployment PRs.
# SAMPLE revision, hosts and secret names: replace them before merging.
# Needs: an identity client `gatekeeper` (resource `gatekeeper`, redirect https://api.example.com/auth/callback,
# post logout URIs of the web apps) with exchange policies for every audience in the routes. The routes are
# part of the gatekeeper chart (ConfigMap gatekeeper-routes, one source for every environment): a route change
# is a gatekeeper release and the bump PR of this file; ArgoCD applies it and Reloader restarts the pods.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/huponx/charts
    chart: gatekeeper
    targetRevision: "v2026.11.15-release-4827813"
    helm:
      releaseName: gatekeeper
      valuesObject:
        routes:
          upstreams:
            identity:
              insecure: false
            courier:
              insecure: false
            dictionary:
              insecure: false
        application:
          config:
            data:
              ENV: "production"
              SERVICE_NAME: "gatekeeper"
              GATEKEEPER_PUBLIC_URL: "https://api.momofamily.top"
              GATEKEEPER_PORTAL_URL: "https://momofamily.top"
              GATEKEEPER_UI_ORIGINS: |-
                https://dict.momofamily.top
                https://momofamily.top
                https://bill.momofamily.top
                https://admin.momofamily.top
              GATEKEEPER_IDENTITY_ISSUER: "https://auth.momofamily.top"
              GATEKEEPER_CLIENT_ID: "gatekeeper"
              GATEKEEPER_AUDIENCE: "gatekeeper"
              # HTTPS listener (HTTPS_ADDR of the chart) for the back-channel logout of identity; certificate: infra-services/production/certificates/gatekeeper.yaml
              GRPC_TLS_CERT_FILE: "/var/run/tls-server/tls.crt"
              GRPC_TLS_KEY_FILE: "/var/run/tls-server/tls.key"
              REDIS_HOST: "redis-external.infrastructure.svc.cluster.local"
              REDIS_PORT: "6379"
              # System status card of the admin app: the applications of ArgoCD (read-only token). Without both
              # this address and the token secret below the route answers 404 and the card stays hidden.
              # GATEKEEPER_ARGOCD_PROJECT: "default"   # list only the applications of one ArgoCD project
              GATEKEEPER_ARGOCD_URL: "http://argocd-server.argocd.svc.cluster.local"
          secrets:
            - name: GATEKEEPER_CLIENT_SECRET
              secretName: gatekeeper-client
              key: secret
            - name: GATEKEEPER_SESSION_KEY
              secretName: gatekeeper-session
              key: keys
            - name: REDIS_PASSWORD
              secretName: redis-local-credentials
              key: password
            # created by mm-ansible (argocd_api_tokens, `make deploy TAGS=argocd`)
            - name: GATEKEEPER_ARGOCD_TOKEN
              secretName: gatekeeper-argocd
              key: token
          ingress:
            enabled: true
            host: "api.momofamily.top"
            tls: true
            tlsSecretName: "gatekeeper-tls"
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 4
          pdb:
            enabled: true
            minAvailable: 50%
  destination:
    name: in-cluster
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
