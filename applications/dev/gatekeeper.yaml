# ArgoCD Application: gatekeeper (dev), the shared HTTP gateway https://api.dev.example.com.
# The web apps (dict.dev.example.com, bill.dev.example.com, ...) call it from the browser (cookie + CORS); mobile apps
# and services call it with Authorization: Bearer. A new web app only needs its origin added to
# GATEKEEPER_UI_ORIGINS (and a post logout URI on the identity client). Chart and image are published by the
# gatekeeper CI/CD; targetRevision is updated by its deployment PRs.
# SAMPLE revision, hosts and secret names: replace them before merging.
# Needs: an identity client `gatekeeper` (resource `gatekeeper`, redirect https://api.dev.example.com/auth/callback,
# post logout URIs of the web apps) with exchange policies for every audience in the routes. The routes are
# part of the gatekeeper chart (ConfigMap gatekeeper-routes, one source for every environment): a route change
# is a gatekeeper release and the bump PR of this file; ArgoCD applies it and Reloader restarts the pods.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/huponx/charts
    chart: gatekeeper
    targetRevision: "1.20261122.1-main-70e62ad"
    helm:
      releaseName: gatekeeper
      valuesObject:
        routes:
          upstreams:
            identity:
              insecure: false
            courier:
              insecure: false
            dictionary:
              insecure: false
        application:
          config:
            data:
              ENV: "dev"
              SERVICE_NAME: "gatekeeper"
              GATEKEEPER_PUBLIC_URL: "https://api.dev.example.com"
              GATEKEEPER_PORTAL_URL: "https://dev.example.com"
              GATEKEEPER_UI_ORIGINS: |-
                https://dict.dev.example.com
                https://dev.example.com
                https://bill.dev.example.com
                https://admin.dev.example.com
              GATEKEEPER_IDENTITY_ISSUER: "https://auth.dev.example.com"
              GATEKEEPER_CLIENT_ID: "gatekeeper"
              GATEKEEPER_AUDIENCE: "gatekeeper"
              # HTTPS listener (HTTPS_ADDR of the chart) for the back-channel logout of identity; certificate: infra-services/dev/certificates/gatekeeper.yaml
              GRPC_TLS_CERT_FILE: "/var/run/tls-server/tls.crt"
              GRPC_TLS_KEY_FILE: "/var/run/tls-server/tls.key"
              REDIS_HOST: "redis-external.infrastructure.svc.cluster.local"
              REDIS_PORT: "6379"
          secrets:
            - name: GATEKEEPER_CLIENT_SECRET
              secretName: gatekeeper-client
              key: secret
            - name: GATEKEEPER_SESSION_KEY
              secretName: gatekeeper-session
              key: keys
            - name: REDIS_PASSWORD
              secretName: redis-local-credentials
              key: password
          ingress:
            enabled: true
            host: "api.dev.example.com"
            tls: true
            tlsSecretName: "gatekeeper-tls"
  destination:
    name: in-cluster
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
