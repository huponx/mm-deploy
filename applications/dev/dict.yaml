# ArgoCD Application: dict (dev), the Dict web app (static SPA served by nginx) at https://dict.dev.example.com.
# It only talks to the gateway https://api.dev.example.com from the browser (cookie + CORS): API_BASE below is its runtime config
# (config.js), and https://dict.dev.example.com must be listed in GATEKEEPER_UI_ORIGINS of gatekeeper.yaml and be a post logout URI
# of the identity client `gatekeeper` (add https://dict.dev.example.com/ to post_logout_uris of the setup config in identity.yaml).
# Chart and image are published by the web CI/CD; targetRevision is updated by its deployment PRs.
# The release name must stay `dict`: the chart mounts the ConfigMap `dict-runtime-config`.
# SAMPLE revision, hosts and secret names: replace them before merging.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dict
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/huponx/charts
    chart: dict
    targetRevision: "1.20261122.1-main-2a7902e"
    helm:
      releaseName: dict
      valuesObject:
        application:
          config:
            runtime:
              data:
                API_BASE: "https://api.dev.example.com"
                # the user menu links back to the portal
                PORTAL_URL: "https://dev.example.com"
          ingress:
            enabled: true
            host: "dict.dev.example.com"
            tls: true
            tlsSecretName: "dict-tls"
  destination:
    name: in-cluster
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
