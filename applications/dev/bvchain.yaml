# ArgoCD Application: bvchain (dev), BV check-in and check-out CronJob.
# Chart and image are published to ghcr.io by the bvchain CI/CD; targetRevision is updated by its deployment PRs.
# SAMPLE revision: replace with a version that exists in oci://ghcr.io/huponx/charts/bvchain before merging.
# Helm replaces lists, so env and secrets below are the complete lists.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bvchain
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/huponx/charts
    chart: bvchain
    targetRevision: "1.20261119.1-main-0854c8f"
    helm:
      releaseName: bvchain
      valuesObject:
        bv-job:
          cronjob:
            schedule: "*/30 8-18 * * 1-5"
          job:
            container:
              env:
                - name: ENV
                  value: "dev"
                - name: LOG_ENCODING
                  value: "json"
                - name: SERVICE_NAME
                  value: "bvchain"
                - name: BV_USERNAME
                  value: "hung.pham"
                - name: DELAY
                  value: "3m"
                # courier authorizes the ServiceAccount of this job (COURIER_AUTH_ALLOWED in courier.yaml)
                - name: COURIER_TARGET
                  value: "courier.application.svc.cluster.local:9090"
                - name: COURIER_TOKEN_FILE
                  value: "/var/run/secrets/courier/token"
                - name: NOTIFY_LOCALE
                  value: "vi"
                # "true" sends a Telegram message after each successful check-in / check-out (template bvchain_checkin/bvchain_checkout)
                - name: NOTIFICATION_SUCCESS_ENABLED
                  value: "false"
          secrets:
            - name: BV_PASSWORD
              secretName: job-bv-credentials
              key: bv-password
            - name: BV_OTP_SECRET
              secretName: job-bv-credentials
              key: bv-otp-secret
            - name: TELEGRAM_CHAT_ID
              secretName: telegram-hung.phamqk-chat
              key: chat-id
  destination:
    name: in-cluster
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
