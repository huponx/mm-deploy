# ArgoCD Application: identity (staging), OAuth 2.0 / OpenID Connect provider (JWT, RBAC, token exchange, MFA).
# Chart and image are published to ghcr.io by the identity CI/CD; targetRevision is updated by its deployment PRs.
# SAMPLE revision, hosts and secret names: replace them before merging.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/huponx/charts
    chart: identity
    targetRevision: "v2026.11.1-release-0c748e6"
    helm:
      releaseName: identity
      valuesObject:
        application:
          config:
            data:
              ENV: "staging"
              SERVICE_NAME: "identity"
              IDENTITY_ISSUER: "https://auth.staging.example.com"
              IDENTITY_SIGNING_KEY_ID: "k1"
              # the portal: where a sign in at identity itself (no application sent the user) ends
              IDENTITY_PORTAL_URL: "https://staging.example.com"
              # the admin app (same host as its ingress): linked in the mail to the users who approve registrations (optional)
              IDENTITY_ADMIN_URL: "https://admin.staging.example.com"
              IDENTITY_MFA_MODE: "optional"
              IDENTITY_MFA_ISSUER_NAME: "Example"
              # Passkeys (WebAuthn). The RP ID is bound into every passkey: changing it later makes all of them unusable, so it is
              # the domain the issuer, the portal and the admin app of this environment share, and stays.
              IDENTITY_WEBAUTHN_RP_ID: "staging.example.com"
              IDENTITY_WEBAUTHN_ORIGINS: "https://auth.staging.example.com,https://staging.example.com,https://admin.staging.example.com"
              # CIDR of the ingress controller (client IP of the rate limits)
              IDENTITY_TRUSTED_PROXIES: "10.0.0.0/8"
              POSTGRES_HOST: "postgres-external.infrastructure.svc.cluster.local"
              POSTGRES_DB: "data"
              POSTGRES_USER: "data-user-rw"
              REDIS_HOST: "redis-external.infrastructure.svc.cluster.local"
              REDIS_PORT: "6379"
              COURIER_TARGET: "courier.application.svc.cluster.local:9090"
          # Existing Secrets, never in git: created by mm-ansible (`k8s_secrets`, values in its vault). The signing key
          # Secret `identity-signing-key` (key signing.pem) is mounted by the chart.
          secrets:
            - name: POSTGRES_PASSWORD
              secretName: postgres-data-rw-credentials
              key: password
            - name: REDIS_PASSWORD
              secretName: redis-local-credentials
              key: password
            - name: IDENTITY_MFA_KEY
              secretName: identity-mfa-key
              key: keys
          ingress:
            enabled: true
            host: "auth.staging.example.com"
            tls: true
            tlsSecretName: "identity-tls"
        # Initial setup Job (first admin, gatekeeper client, exchange policy): see the identity README
        # ("Initial setup Job"). It creates the admin only when no admin exists, with the temporary password of
        # the Secret identity-admin (the admin must change it at the first sign in). REMOVE this whole `setup:`
        # block after the Job succeeded and the admin changed the password; it is not needed again.
        setup:
          enabled: true
          job:
            container:
              env:
                - name: POSTGRES_HOST
                  value: "postgres-external.infrastructure.svc.cluster.local"
                - name: POSTGRES_DB
                  value: "data"
                - name: POSTGRES_USER
                  value: "data-user-rw"
                - name: SETUP_CONFIG
                  value: '{"admin":{"email":"admin@staging.example.com"},"clients":[{"id":"gatekeeper","type":"confidential","resource":"gatekeeper","secret_env":"GATEKEEPER_CLIENT_SECRET","backchannel_logout_uri":"http://gatekeeper.application.svc/auth/backchannel-logout","redirect_uris":["https://api.staging.example.com/auth/callback"],"post_logout_uris":["https://admin.staging.example.com/","https://dict.staging.example.com/","https://bill.staging.example.com/","https://staging.example.com/"],"grants":["authorization_code","refresh_token","client_credentials","urn:ietf:params:oauth:grant-type:token-exchange"]},{"id":"dictionary","type":"confidential","resource":"dictionary","secret_env":"DICTIONARY_CLIENT_SECRET","roles":["service_registrar"],"grants":["client_credentials","urn:ietf:params:oauth:grant-type:token-exchange"]},{"id":"courier","type":"confidential","resource":"courier","secret_env":"COURIER_CLIENT_SECRET","roles":["service_registrar","user_directory"],"grants":["client_credentials"]}],"exchange_policies":[{"client":"gatekeeper","audience":"identity","max_depth":1},{"client":"gatekeeper","audience":"dictionary","max_depth":1},{"client":"dictionary","audience":"identity","max_depth":2},{"client":"gatekeeper","audience":"courier","max_depth":1},{"client":"courier","audience":"identity","max_depth":1}]}'
          secrets:
            - name: POSTGRES_PASSWORD
              secretName: postgres-data-rw-credentials
              key: password
            - name: SETUP_ADMIN_PASSWORD
              secretName: identity-admin
              key: password
            - name: GATEKEEPER_CLIENT_SECRET
              secretName: gatekeeper-client
              key: secret
            - name: DICTIONARY_CLIENT_SECRET
              secretName: dictionary-client
              key: secret
            - name: COURIER_CLIENT_SECRET
              secretName: courier-client
              key: secret
  destination:
    name: in-cluster
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
