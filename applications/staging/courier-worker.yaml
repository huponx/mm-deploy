# ArgoCD Application: courier-worker (dev), consumes the Redis stream and sends email and Telegram.
# SAMPLE revision: replace with a version that exists in oci://ghcr.io/huponx/charts/courier-worker before merging.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: courier-worker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/huponx/charts/courier-worker
    path: .
    targetRevision: "v2026.11.1-release-1abe02a"
    helm:
      releaseName: courier-worker
      valuesObject:
        application:
          config:
            data:
              ENV: "dev"
              SERVICE_NAME: "courier-worker"
              REDIS_HOST: "redis-external.infrastructure.svc.cluster.local"
              REDIS_PORT: "6379"
              SMTP_HOST: "smtp.gmail.com"
              SMTP_PORT: "587"
              SMTP_USER: "home.annoucement@gmail.com"
              SMTP_FROM: "MMFamily <home.annoucement@gmail.com>"
          secrets:
            - name: REDIS_PASSWORD
              secretName: redis-local-credentials
              key: password
            - name: SMTP_PASSWORD
              secretName: gmail-smtp-credentials
              key: password
            - name: TELEGRAM_BOT_TOKEN
              secretName: telegram-hung.phamqk-credentials
              key: bot-token
  destination:
    name: in-cluster
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
