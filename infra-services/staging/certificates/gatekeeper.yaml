# Server certificate of the HTTPS listener of gatekeeper (back-channel logout of identity), signed by the internal CA
# (mm-ansible, role microk8s). cert-manager writes tls.crt, tls.key and ca.crt to the Secret gatekeeper-grpc-tls and
# renews it in place; the pod picks the new files up without a restart. The Secret is mounted by the gatekeeper chart at
# /var/run/tls-server; GRPC_TLS_CERT_FILE/KEY_FILE in the Application turn the listener on.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gatekeeper-grpc-tls
  namespace: application
spec:
  secretName: gatekeeper-grpc-tls
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - gatekeeper.application.svc
    - gatekeeper.application.svc.cluster.local
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
